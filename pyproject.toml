[build-system]
requires = ["setuptools>=77,<83", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "job-os-backend"
version = "0.1.0"
description = "Local backend for the Job OS Windows desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6.19,<7",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "openpyxl>=3.1.5,<3.2",
    "defusedxml>=0.7.1,<0.8",
    "fastapi>=0.141,<0.142",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "starlette>=1.7,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pip-tools>=7.5,<8",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "setuptools>=77,<83",
    "wheel>=0.45,<1",
]

[project.scripts]
job-os-backend = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
