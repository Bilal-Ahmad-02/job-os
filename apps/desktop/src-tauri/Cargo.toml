[package]
name = "oracle-desktop"
version = "0.1.0"
description = "Oracle personal desktop workspace"
edition = "2021"
rust-version = "1.98.1"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
argon2 = { version = "0.6", features = ["getrandom", "zeroize"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
